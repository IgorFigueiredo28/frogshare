<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Share</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>&#x1F438; Screen Share</h1>
      <p class="subtitle">Assista a tela do seu amigo em tempo real, sem lag.</p>

      <div class="actions">
        <div class="join-form">
          <input type="text" id="input-room" placeholder="Codigo da sala" maxlength="8" autocomplete="off">
          <button id="btn-join" class="btn btn-primary">Entrar</button>
        </div>
      </div>

      <div class="download-section">
        <p class="download-hint">Quer compartilhar sua tela? Baixe o app:</p>
        <a href="https://github.com/IgorFigueiredo28/telaskzpetentes/releases/latest/download/Screen.Share.1.1.0.exe" class="btn btn-secondary btn-download">Baixar App (Windows)</a>
      </div>
    </div>

  </div>

  <script>
    const btnJoin = document.getElementById('btn-join');
    const inputRoom = document.getElementById('input-room');

    function showToast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    btnJoin.addEventListener('click', () => {
      const code = inputRoom.value.trim().toLowerCase();
      if (!code) {
        showToast('Digite o codigo da sala');
        return;
      }
      window.location.href = `/room.html?room=${code}`;
    });

    inputRoom.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnJoin.click();
    });
  </script>
</body>
</html>

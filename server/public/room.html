<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala · FrogShare</title>
  <meta name="theme-color" content="#F3F8EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1A10" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/brand/icon.ico" sizes="any">
  <script src="/brand/theme.js"></script>
  <link rel="stylesheet" href="/brand/frog-theme.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-room" data-state="init">
  <div class="room">
    <header class="room-top">
      <a href="/" class="brand" aria-label="FrogShare, voltar ao início">
        <img src="/brand/icon.svg" alt="" width="32" height="32">
        <span class="brand-name">Frog<b>Share</b></span>
      </a>

      <div class="room-meta">
        <span class="chip chip-code" title="Código da sala">
          <svg class="ico ico-sm" aria-hidden="true"><use href="/brand/icons.svg#i-link"/></svg>
          <span class="sr-only">Sala</span><span id="room-code"></span>
        </span>
        <span class="chip" id="room-status" aria-live="polite">Esperando</span>
        <span class="chip chip-watchers">
          <svg class="ico ico-sm" aria-hidden="true"><use href="/brand/icons.svg#i-eye"/></svg>
          <span id="viewer-count">0 assistindo</span>
        </span>
      </div>

      <div class="room-controls">
        <div class="volume-control" id="volume-control" style="display:none">
          <button id="btn-mute" type="button" class="btn btn-ghost btn-icon" aria-label="Mutar" title="Mutar (M)">
            <svg id="icon-vol" class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"/>
              <path id="icon-vol-wave1" d="M15 8a5 5 0 0 1 0 8"/>
              <path id="icon-vol-wave2" d="M17.7 5a9 9 0 0 1 0 14"/>
              <path id="icon-vol-x" d="M16 10l4 4m0 -4l-4 4" style="display:none"/>
            </svg>
          </button>
          <input type="range" id="volume-slider" min="0" max="100" step="1" value="100" aria-label="Volume">
          <span class="volume-value" id="volume-value">100%</span>
        </div>
        <button id="btn-info" type="button" class="btn btn-ghost btn-icon" style="display:none"
                aria-label="Informações da transmissão" aria-pressed="false" title="Mostrar ou esconder as informações da transmissão (I)">
          <svg class="ico" aria-hidden="true"><use href="/brand/icons.svg#i-info"/></svg>
        </button>
        <button id="btn-fullscreen" type="button" class="btn btn-secondary" style="display:none">Tela cheia</button>
        <button type="button" class="btn btn-ghost btn-icon theme-toggle" data-theme-toggle>
          <svg class="ico i-moon" aria-hidden="true"><use href="/brand/icons.svg#i-moon"/></svg>
          <svg class="ico i-sun" aria-hidden="true"><use href="/brand/icons.svg#i-sun"/></svg>
        </button>
      </div>
    </header>

    <div class="notice host-notice" id="host-notice" style="display:none" role="status">
      <svg class="ico" aria-hidden="true"><use href="/brand/icons.svg#i-alert"/></svg>
      <span class="notice-text">O host está usando uma versão antiga do app, por isso a transmissão pode travar. Peça para ele baixar a versão nova em <a href="/" target="_blank" rel="noopener">frogshare.onrender.com</a>.</span>
      <button id="host-notice-close" type="button" class="btn btn-ghost btn-icon" aria-label="Fechar aviso">
        <svg class="ico" aria-hidden="true"><use href="/brand/icons.svg#i-x"/></svg>
      </button>
    </div>

    <main class="stage">
      <div class="video-area" id="video-area">
        <div class="placeholder" id="placeholder">
          <div class="empty-state">
            <img id="placeholder-frog" src="/brand/frog-sleep.svg" alt="" width="132" height="121">
            <p id="status-text" class="empty-title">Esperando o host compartilhar a tela…</p>
            <p id="placeholder-hint" class="empty-text">A transmissão aparece aqui sozinha assim que começar.</p>
            <span class="bubbles" id="placeholder-bubbles" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
        </div>
        <video id="remote-video" autoplay playsinline muted style="display:none"></video>
        <div class="stats-overlay" id="stats-overlay" style="display:none">
          <button id="stats-close" type="button" class="stats-close" aria-label="Esconder informações da transmissão" title="Esconder (I)">
            <svg class="ico" aria-hidden="true"><use href="/brand/icons.svg#i-x"/></svg>
          </button>
          <div id="stats-lines"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/room.js"></script>
  <script src="/js/room-ui.js"></script>
</body>
</html>

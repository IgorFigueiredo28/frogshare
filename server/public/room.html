<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala - Screen Share</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="room-container">
    <header class="room-header">
      <a href="/" class="logo">&#x1F438; Screen Share</a>
      <div class="room-info">
        <span class="room-code" id="room-code"></span>
        <span class="viewer-count" id="viewer-count">0 assistindo</span>
      </div>
      <div class="room-controls">
        <div class="volume-control" id="volume-control" style="display:none">
          <button id="btn-mute" class="btn btn-small btn-icon" aria-label="Mutar" title="Mutar (M)">
            <svg id="icon-vol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/>
              <path id="icon-vol-wave1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/>
              <path id="icon-vol-wave2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M18 7a7 7 0 0 1 0 10"/>
              <path id="icon-vol-x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/>
            </svg>
          </button>
          <input type="range" id="volume-slider" min="0" max="100" step="1" value="100" aria-label="Volume">
          <span class="volume-value" id="volume-value">100%</span>
        </div>
        <button id="btn-info" class="btn btn-small" style="display:none" title="Informacoes da transmissao (I)">Info</button>
        <button id="btn-fullscreen" class="btn btn-small" style="display:none">Tela Cheia</button>
      </div>
    </header>

    <div class="host-notice" id="host-notice" style="display:none" role="status">
      <span>O host está usando uma versão antiga do app, por isso a transmissão pode travar. Peça para ele baixar a versão nova em <a href="/" target="_blank" rel="noopener">telaskzpetentes.onrender.com</a>.</span>
      <button id="host-notice-close" class="host-notice-close" aria-label="Fechar aviso">&times;</button>
    </div>

    <main class="room-main">
      <div class="video-area" id="video-area">
        <div class="placeholder" id="placeholder">
          <p id="status-text">Aguardando host compartilhar a tela...</p>
        </div>
        <video id="remote-video" autoplay playsinline muted style="display:none"></video>
        <div class="stats-overlay" id="stats-overlay" style="display:none"></div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala - Screen Share</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="room-container">
    <header class="room-header">
      <a href="/" class="logo">&#x1F438; Screen Share</a>
      <div class="room-info">
        <span class="room-code" id="room-code"></span>
        <span class="viewer-count" id="viewer-count">0 assistindo</span>
      </div>
      <div class="room-controls">
        <button id="btn-mute" class="btn btn-small" style="display:none">Mutar</button>
        <button id="btn-fullscreen" class="btn btn-small" style="display:none">Tela Cheia</button>
      </div>
    </header>

    <main class="room-main">
      <div class="video-area" id="video-area">
        <div class="placeholder" id="placeholder">
          <p id="status-text">Aguardando host compartilhar a tela...</p>
        </div>
        <video id="remote-video" autoplay playsinline style="display:none"></video>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
